version: "3.9"

networks:
  livekit-net:
    driver: bridge

services:

  redis:
    image: redis:7-alpine
    container_name: lk-redis
    networks:
      - livekit-net
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server
    container_name: lk-server
    command: ["--config", "/etc/livekit/livekit.yaml", "--dev"]
    ports:
      - "7880:7880"         # HTTP + WebSocket signaling
      - "7881:7881"         # TLS
      - "7882:7882/udp"     # WebRTC media — CRITICAL
    volumes:
      - ./config/livekit.yaml:/etc/livekit/livekit.yaml
    networks:
      - livekit-net
    depends_on:
      - redis
    restart: unless-stopped

  egress:
    image: livekit/egress
    container_name: lk-egress
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress/config.yaml
    volumes:
      - ./config/egress.yaml:/etc/egress/config.yaml
      - ./recordings:/recordings    # local folder where recordings land
    networks:
      - livekit-net
    depends_on:
      - livekit
    restart: unless-stopped
    # egress needs a display for Chrome-based recording
    # on Windows Docker Desktop this runs fine headlessly in the container

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lk-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ws://livekit:7880          # internal Docker DNS
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      BIND_ADDR: "0.0.0.0:3000"
      RUST_LOG: info
    networks:
      - livekit-net
    depends_on:
      - livekit
    restart: unless-stopped